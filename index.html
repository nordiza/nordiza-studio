<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101019">
<title>Nordiza Studio 3.0 · Generador de Prompts</title>
<style>
:root{color-scheme:dark;--bg:#101019;--panel:#1b1b29;--line:#343449;--text:#f4f1ff;--muted:#aaa9c0;--accent:#ad8cff;--accent2:#7c59d9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#34244f 0%,var(--bg) 55%);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px 14px}.app{width:min(100%,560px)}header{text-align:center;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--accent);font-weight:750;text-transform:uppercase}h1{font-size:clamp(27px,6vw,38px);line-height:1.1;margin:10px 0}header p{color:var(--muted);margin:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,5vw,30px);box-shadow:0 20px 60px #0004}.fields{display:grid;grid-template-columns:1fr 1fr;gap:17px}label{display:block;font-size:13px;font-weight:700;margin-bottom:8px;color:#dcd7ed}select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:#12121e;color:var(--text);font:inherit;outline:none}select{padding:13px 10px;min-height:49px}select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #ad8cff22}button{cursor:pointer;border:0;border-radius:12px;font:inherit;font-weight:750;min-height:48px;transition:transform .15s,filter .15s}button:active{transform:scale(.985)}.primary{width:100%;background:linear-gradient(110deg,var(--accent),var(--accent2));color:#110d1d;margin-top:23px}.primary:hover{filter:brightness(1.1)}.output{margin-top:24px;border-top:1px solid var(--line);padding-top:22px}.output-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.output-head label{margin:0}.count{font-size:12px;color:var(--muted)}textarea{resize:vertical;min-height:150px;padding:14px;line-height:1.55}.copy{width:100%;background:#302b43;color:#eee7ff;border:1px solid #574777;margin-top:12px}.copy:hover{background:#403653}.status{min-height:22px;text-align:center;color:#a9e6be;font-size:13px;margin-top:8px}footer{text-align:center;color:var(--muted);font-size:13px;margin-top:25px}footer strong{color:#d7c8ff}@media(max-width:440px){.fields{grid-template-columns:1fr}.panel{border-radius:17px}.app{max-width:420px}}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}.actions .copy{margin-top:23px}.favorites{display:grid;gap:10px}.favItem{background:#12121e;border:1px solid var(--line);padding:12px;border-radius:12px}.favItem p{font-size:13px;color:var(--muted);margin:5px 0 10px;overflow-wrap:anywhere}.favItem .favActions{display:flex;gap:8px}.favActions button{min-height:36px;flex:1;background:#302b43;color:var(--text);font-size:13px}.hint{font-size:12px;color:var(--muted);margin:12px 0 0}.importLabel{display:block;text-align:center;background:#302b43;border:1px solid #574777;border-radius:12px;padding:12px;margin-top:10px;cursor:pointer;font-size:14px}.empty{color:var(--muted);font-size:13px}@media(max-width:440px){.actions{grid-template-columns:1fr 1fr}.actions button{font-size:13px;padding:5px}}
</style>
</head>
<body><main class="app"><header><div class="eyebrow">Nordiza Studio · Versión 3.0</div><h1>Generador de Prompts<br>para Suno</h1><p>Convierte tu idea musical en una descripción lista para usar.</p></header><section class="panel" aria-label="Configuración musical"><div class="fields"><div><label for="language">Idioma del prompt</label><select id="language"><option value="en">Inglés</option><option value="es">Español</option></select></div><div><label for="genre">Género musical</label><select id="genre"><option value="pop">Pop</option><option value="lofi">Lo-fi</option><option value="rock">Rock</option><option value="reggaeton">Reggaetón</option><option value="ballad">Balada</option><option value="electronic">Electrónica</option><option value="cinematic">Cinemático</option><option value="salsa">Salsa</option><option value="vallenato">Vallenato urbano</option><option value="bachata">Bachata</option><option value="cumbia">Cumbia</option></select></div><div><label for="mood">Emoción o ambiente</label><select id="mood"><option value="melancholic">Melancólico</option><option value="energetic">Energético</option><option value="relaxed">Relajante</option><option value="epic">Épico</option><option value="romantic">Romántico</option><option value="joyful">Alegre</option><option value="nostalgic">Nostálgico</option></select></div><div><label for="voice">Tipo de voz</label><select id="voice"><option value="female">Voz femenina suave</option><option value="male">Voz masculina rasgada</option><option value="choir">Coro</option><option value="instrumental">Solo instrumental</option><option value="duet">Dúo masculino y femenino</option><option value="maleWarm">Voz masculina cálida</option><option value="femalePower">Voz femenina potente</option></select></div><div><label for="tempo">Tempo</label><select id="tempo"><option value="slow">Lento</option><option value="medium" selected>Medio</option><option value="fast">Rápido</option></select></div></div><div class="actions"><button class="primary" id="generate">✦ Generar Prompt</button><button class="copy" id="surprise" type="button">🎲 Sorpréndeme</button></div><div class="output"><div class="output-head"><label for="result">Tu prompt <span id="languageLabel">en inglés</span></label><span class="count" id="count">0 / 1000</span></div><textarea id="result" maxlength="1000" placeholder="Tu descripción musical aparecerá aquí..." spellcheck="false"></textarea><button class="copy" id="favorite" type="button">♡ Guardar en favoritos</button><button class="copy" id="copy">Copiar al portapapeles</button><button class="copy" id="selectAll" type="button">Seleccionar texto para copiar manualmente</button><div class="status" id="status" role="status" aria-live="polite"></div></div><div class="output"><div class="output-head"><label>Mis favoritos <span id="favCount">(0)</span></label></div><div id="favorites" class="favorites"></div><button class="copy" id="export" type="button">↓ Exportar favoritos (.json)</button><label class="importLabel" for="import">↑ Importar favoritos (.json)</label><input id="import" type="file" accept="application/json,.json" hidden><p class="hint">Se guardan en este navegador y pueden perderse si borras sus datos. Exporta una copia de seguridad.</p></div></section><footer>Creado por <strong>Nordiza</strong> · Música e imaginación</footer></main>
<script>
const $=id=>document.getElementById(id);
const genres={
pop:['Contemporary melodic pop','bright synth layers, clean electric guitar, warm bass, crisp pop drums','radio-ready arrangement, polished vocal production'],
lofi:['Lo-fi chillhop','dusty Rhodes keys, mellow jazz guitar, soft sub bass, laid-back sampled drums','warm tape saturation, vinyl texture, intimate mix'],
rock:['Modern melodic rock','overdriven electric guitars, live bass, punchy acoustic drums','dynamic guitar layering, organic drum sound, wide stereo mix'],
reggaeton:['Contemporary urban reggaeton','syncopated dembow drums, deep sub bass, rhythmic synth stabs, Latin percussion','club-ready low end, tight transients, modern urban mix'],
ballad:['Emotional contemporary ballad','expressive piano, acoustic guitar, warm strings, restrained drums','intimate verses, gradual dynamic build, spacious reverb'],
electronic:['Modern electronic dance music','pulsing synthesizers, four-on-the-floor kick, arpeggiators, electronic bass','sidechain compression, atmospheric transitions, wide synth production'],
cinematic:['Cinematic orchestral soundtrack','sweeping strings, brass, orchestral percussion, atmospheric pads','dramatic crescendos, expansive spatial mix, film-score dynamics'],
salsa:['Contemporary romantic salsa','piano montuno, congas, bongos, timbales, cowbell, brass section, syncopated bass','live Latin ensemble feel, rhythmic breaks, bright brass arrangement'],
vallenato:['Urban vallenato-pop fusion','expressive Colombian accordion, strummed acoustic guitar, caja vallenata, guacharaca, dembow-inspired drums, deep bass','festive modern Latin production, punchy percussion, catchy melodic hooks'],
bachata:['Modern romantic bachata','requinto guitar, rhythmic acoustic guitar, güira, bongos, rounded bass','crisp guitar interplay, intimate vocal mix, smooth tropical production'],
cumbia:['Modern Colombian cumbia','cumbia percussion, guacharaca, melodic accordion, warm bass, rhythmic guitars','organic dance groove, vibrant tropical mix']};
const moods={melancholic:'wistful, reflective, bittersweet atmosphere',energetic:'high-energy, uplifting, danceable feel',relaxed:'calm, dreamy, unhurried atmosphere',epic:'grand, powerful, emotionally soaring atmosphere',romantic:'tender, passionate, heartfelt mood',joyful:'playful, sunny, celebratory mood',nostalgic:'warm, sentimental, memory-filled atmosphere'};
const voices={female:'soft expressive female lead vocal, intimate phrasing',male:'gritty expressive male lead vocal, textured delivery',choir:'layered mixed choir, rich vocal harmonies',instrumental:'instrumental only, no vocals, no spoken words',duet:'expressive male and female duet, call-and-response harmonies',maleWarm:'warm mature male lead vocal, smooth phrasing',femalePower:'powerful female lead vocal, dynamic high notes'};
const tempos={slow:'slow tempo, spacious groove',medium:'mid-tempo, steady rhythmic pulse',fast:'fast tempo, driving rhythmic momentum'};
const spanish={
 genres:{pop:['Pop melódico contemporáneo','capas de sintetizadores brillantes, guitarra eléctrica limpia, bajo cálido y batería pop definida','arreglo comercial pulido y producción vocal detallada'],lofi:['Lo-fi chillhop','teclados Rhodes suaves, guitarra jazz, subgrave cálido y batería sampleada relajada','saturación de cinta, textura de vinilo y mezcla íntima'],rock:['Rock melódico moderno','guitarras eléctricas saturadas, bajo en vivo y batería acústica contundente','capas dinámicas de guitarra, batería orgánica y mezcla estéreo amplia'],reggaeton:['Reguetón urbano contemporáneo','ritmo dembow sincopado, subgrave profundo, sintetizadores rítmicos y percusión latina','graves potentes, transitorios definidos y mezcla urbana moderna'],ballad:['Balada contemporánea emotiva','piano expresivo, guitarra acústica, cuerdas cálidas y batería contenida','estrofas íntimas, crecimiento dinámico gradual y reverberación espaciosa'],electronic:['Música electrónica bailable moderna','sintetizadores pulsantes, bombo a negras, arpegiadores y bajo electrónico','compresión sidechain, transiciones atmosféricas y producción estéreo amplia'],cinematic:['Banda sonora orquestal cinematográfica','cuerdas envolventes, metales, percusión orquestal y pads atmosféricos','crescendo dramático, mezcla expansiva y dinámica cinematográfica'],salsa:['Salsa romántica contemporánea','montuno de piano, congas, bongós, timbales, campana, metales y bajo sincopado','sensación de orquesta en vivo, cortes rítmicos y metales brillantes'],vallenato:['Fusión de vallenato pop urbano','acordeón colombiano expresivo, guitarra acústica rasgueada, caja vallenata, guacharaca, batería con influencia dembow y bajo profundo','producción latina festiva y moderna, percusión contundente y ganchos melódicos'],bachata:['Bachata romántica moderna','requinto, guitarra rítmica, güira, bongós y bajo redondo','diálogo nítido entre guitarras, mezcla vocal íntima y producción tropical suave'],cumbia:['Cumbia colombiana moderna','percusión de cumbia, guacharaca, acordeón melódico, bajo cálido y guitarras rítmicas','ritmo bailable orgánico y mezcla tropical vibrante']},
 moods:{melancholic:'atmósfera melancólica, reflexiva y agridulce',energetic:'energía elevada, optimista y bailable',relaxed:'ambiente tranquilo, soñador y pausado',epic:'atmósfera grandiosa, poderosa y emocionalmente ascendente',romantic:'ambiente tierno, apasionado y sentimental',joyful:'ambiente alegre, luminoso y festivo',nostalgic:'atmósfera cálida, nostálgica y sentimental'},
 voices:{female:'voz femenina principal suave y expresiva, fraseo íntimo',male:'voz masculina principal rasgada y expresiva, interpretación con textura',choir:'coro mixto en capas, armonías vocales ricas',instrumental:'solo instrumental, sin voces ni palabras habladas',duet:'dúo expresivo de hombre y mujer, armonías de pregunta y respuesta',maleWarm:'voz masculina madura y cálida, fraseo suave',femalePower:'voz femenina potente, notas agudas dinámicas'},
 tempos:{slow:'tempo lento, ritmo espacioso',medium:'tempo medio, pulso rítmico constante',fast:'tempo rápido, impulso rítmico enérgico'}
};
function generate(){const es=$('language').value==='es';const g=es?spanish.genres[$('genre').value]:genres[$('genre').value];const v=$('voice').value;const prompt=[g[0],(es?spanish.moods:moods)[$('mood').value],(es?spanish.tempos:tempos)[$('tempo').value],(es?spanish.voices:voices)[v],g[1],g[2],v==='instrumental'?(es?'desarrollo melódico instrumental':'melodic instrumental development'):(es?'gancho melódico memorable y transiciones claras entre secciones':'memorable melodic hook and clear song-section transitions'),es?'masterización equilibrada y arreglo detallado':'balanced mastering, detailed arrangement'].join(', ')+'.';$('result').value=prompt.slice(0,1000);$('languageLabel').textContent=es?'en español':'en inglés';update();status('Prompt generado. Puedes editarlo antes de copiarlo.')}
function status(message){$('status').textContent=message}
function surprise(){for(const id of ['genre','mood','voice','tempo']){const s=$(id);s.selectedIndex=Math.floor(Math.random()*s.options.length)}generate();status('🎲 ¡Nueva combinación sorpresa! Puedes ajustar cualquier opción.')}
const storageKey='nordiza_studio_favoritos_v3';let favorites=[];
try{const data=JSON.parse(localStorage.getItem(storageKey)||'[]');if(Array.isArray(data))favorites=data.filter(x=>x&&typeof x.text==='string').slice(0,200)}catch(e){}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(favorites));return true}catch(e){status('No se pudo guardar en este navegador. Exporta tus favoritos como copia de seguridad.');return false}}
function saveFavorite(){const value=$('result').value.trim();if(!value){status('Primero genera un prompt.');return}if(favorites.some(x=>x.text===value)){status('Este prompt ya está en favoritos.');return}favorites.unshift({id:Date.now()+'-'+Math.random().toString(36).slice(2),text:value,language:$('language').value,genre:$('genre').value,created:new Date().toISOString()});favorites=favorites.slice(0,200);persist();renderFavorites();status('♡ Prompt añadido a favoritos.')}
function renderFavorites(){const root=$('favorites');root.replaceChildren();$('favCount').textContent='('+favorites.length+')';if(!favorites.length){const p=document.createElement('p');p.className='empty';p.textContent='Todavía no tienes favoritos. Guarda tu primer prompt.';root.appendChild(p);return}for(const item of favorites){const wrap=document.createElement('div');wrap.className='favItem';const label=document.createElement('strong');label.textContent=(item.language==='es'?'ES':'EN')+' · '+(item.genre||'Estilo musical');const p=document.createElement('p');p.textContent=item.text.length>170?item.text.slice(0,170)+'…':item.text;const actions=document.createElement('div');actions.className='favActions';const load=document.createElement('button');load.textContent='Abrir';load.addEventListener('click',()=>{$('result').value=item.text.slice(0,1000);$('language').value=item.language==='es'?'es':'en';$('languageLabel').textContent=item.language==='es'?'en español':'en inglés';update();status('Favorito cargado. Puedes editarlo y copiarlo.');$('result').scrollIntoView({behavior:'smooth',block:'center'})});const del=document.createElement('button');del.textContent='Eliminar';del.addEventListener('click',()=>{favorites=favorites.filter(x=>x.id!==item.id);persist();renderFavorites();status('Favorito eliminado.')});actions.append(load,del);wrap.append(label,p,actions);root.appendChild(wrap)}}
function exportFavorites(){const blob=new Blob([JSON.stringify({app:'Nordiza Studio',version:3,favorites},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nordiza-favoritos.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status('Copia de favoritos preparada para descargar.')}
async function importFavorites(e){const file=e.target.files?.[0];if(!file)return;try{if(file.size>2e6)throw Error('Archivo demasiado grande');const data=JSON.parse(await file.text());if(!Array.isArray(data.favorites))throw Error('Formato incorrecto');let added=0;for(const item of data.favorites){if(typeof item?.text!=='string'||!item.text.trim()||item.text.length>1000||favorites.some(x=>x.text===item.text)||favorites.length>=200)continue;favorites.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),text:item.text,language:item.language==='es'?'es':'en',genre:String(item.genre||'').slice(0,50)});added++}persist();renderFavorites();status('Importación terminada: '+added+' favoritos nuevos.')}catch(err){status('No se pudo importar. Usa un archivo JSON exportado por Nordiza Studio.')}e.target.value=''}
function update(){$('count').textContent=$('result').value.length+' / 1000'}
function selectAll(){const field=$('result');field.focus();field.select();field.setSelectionRange(0,field.value.length);$('status').textContent='Texto seleccionado. Mantén pulsado sobre él y elige Copiar en el menú de tu móvil.'}
async function copy(){
 const value=$('result').value;
 if(!value.trim()){$('status').textContent='Primero genera un prompt.';return}
 let copied=false;
 if(navigator.clipboard && window.isSecureContext){try{await navigator.clipboard.writeText(value);copied=true}catch(e){}}
 if(!copied){
  const field=$('result');field.focus();field.select();field.setSelectionRange(0,value.length);
  try{copied=document.execCommand('copy')}catch(e){}
 }
 if(!copied){
  const helper=document.createElement('textarea');helper.value=value;helper.setAttribute('readonly','');helper.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';document.body.appendChild(helper);helper.focus();helper.select();helper.setSelectionRange(0,value.length);
  try{copied=document.execCommand('copy')}catch(e){}
  helper.remove();
 }
 if(copied){$('status').textContent='✓ ¡Copiado! Ahora puedes pegarlo en Suno o en este chat.';$('copy').textContent='✓ Copiado';setTimeout(()=>$('copy').textContent='Copiar al portapapeles',1800)}
 else{selectAll();$('status').textContent='Tu navegador ha bloqueado la copia automática. El texto está seleccionado: usa Copiar en el menú del móvil.'}
}
$('surprise').addEventListener('click',surprise);$('favorite').addEventListener('click',saveFavorite);$('export').addEventListener('click',exportFavorites);$('import').addEventListener('change',importFavorites);renderFavorites();$('generate').addEventListener('click',generate);$('copy').addEventListener('click',copy);$('selectAll').addEventListener('click',selectAll);$('result').addEventListener('input',update);generate();
</script></body></html>
